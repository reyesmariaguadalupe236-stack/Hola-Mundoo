<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página en la Nube</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e9d8a6 0%, #d8b4fe 50%, #af7ac5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(112, 48, 160, 0.2);
            border: 2px solid #e9d8fd;
        }

        /* AQUÍ SE CONFIGURA LA IMAGEN */
        .imagen-mundo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 4px solid #9b59b6;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #6b21a8;
            margin-top: 0;
            font-size: 2rem;
        }

        p {
            color: #581c87;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background-color: #f3e8ff;
            color: #7e22ce;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #d8b4fe;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- AQUÍ PONES TU IMAGEN -->
        <!-- Cambia "mundo.jpeg" por el nombre exacto de tu archivo de imagen -->
        <img src="1.jpeg" alt="Imagen del Mundo" class="imagen-mundo">

        <h1>¡Hola Mundo!</h1>
        <p>Esta es mi primera práctica publicada en la nuve  mediante <strong>GitHub Pages</strong>.</p>
        
        <span class="badge">✨ Live Goes On ✨</span>
    </div>

</body>
</html>
